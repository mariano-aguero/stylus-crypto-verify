[package]
name = "stylus-crypto-verify-demo"
description = "Deployable Stylus contract demonstrating stylus-crypto-verify"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
stylus-crypto-verify = { path = "../../crates/stylus-crypto-verify" }
alloy-primitives = "1.5.7"
stylus-sdk = "0.10.7"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["mini-alloc"]
export-abi = ["stylus-sdk/export-abi"]
mini-alloc = ["stylus-sdk/mini-alloc"]
